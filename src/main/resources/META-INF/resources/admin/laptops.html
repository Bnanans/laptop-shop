<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Manage Laptops</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container">
        <h1>Manage Laptops</h1>
        <div id="list"></div>
        <button onclick="location.href='/admin/login.html'">Logout</button>
    </div>
    <script>
        async function load() {
            const res = await fetch('/api/laptops');
            const data = await res.json();
            document.getElementById('list').innerText = JSON.stringify(data, null, 2);
        }
        load();
    </script>
</body>

</html>
