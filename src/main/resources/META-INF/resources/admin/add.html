<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thêm/Sửa Sản Phẩm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f6f9; color: #333; }
        .sidebar { width: 260px; background-color: #343a40; color: #fff; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 22px; font-weight: bold; text-align: center; background: #212529; border-bottom: 1px solid #4b545c; }
        .sidebar-menu { list-style: none; flex: 1; padding-top: 20px; }
        .sidebar-menu li { padding: 15px 25px; cursor: pointer; transition: 0.3s; }
        .sidebar-menu li:hover, .sidebar-menu li.active { background-color: #495057; border-left: 4px solid #007bff; }
        .sidebar-menu li a { color: #fff; text-decoration: none; display: block; font-size: 16px; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 40px;}
        .form-container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; cursor: pointer; background: #007bff; color: #fff; border: none; border-radius: 4px; font-weight: bold; width: 100%;}
        button:hover { background: #0056b3; }
        .back-link { display: block; margin-bottom: 20px; text-decoration: none; color: #007bff; font-weight: bold;}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">Admin Panel</div>
        <ul class="sidebar-menu">
            <li class="active"><a href="index.html">📦 Quản lý Laptop</a></li>
            <li><a href="orders.html">🛒 Quản lý Đơn hàng</a></li>
            <li><a href="customers.html">👥 Quản lý Khách hàng</a></li>
            <li><a href="/">🌐 Quay lại Store</a></li>
        </ul>
    </aside>
    <div class="main-content">
        <div class="form-container" id="laptop-form">
            <a href="index.html" class="back-link">&larr; Quay lại danh sách</a>
            <h2 id="page-title">Thêm Laptop Mới</h2>
            
            <input type="hidden" id="laptop-id">
            <div class="form-group">
                <label>Tên Laptop:</label>
                <input type="text" id="name" required placeholder="Nhập tên sản phẩm...">
            </div>
            <div class="form-group">
                <label>Hãng (Brand):</label>
                <input type="text" id="brand" placeholder="Ví dụ: Mac, ASUS, Dell...">
            </div>
            <div class="form-group">
                <label>Giá ($):</label>
                <input type="number" id="price" required placeholder="Nhập giá...">
            </div>
            <div class="form-group">
                <label>Số lượng trong kho:</label>
                <input type="number" id="quantity" min="0" required placeholder="Nhập số lượng...">
            </div>
            <div class="form-group">
                <label>Mô tả sản phẩm:</label>
                <textarea id="description" rows="5" placeholder="Nhập mô tả sản phẩm..." style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px;"></textarea>
            </div>
            <div class="form-group">
                <label>Ảnh sản phẩm (Upload từ máy tính):</label>
                <input type="file" id="imageFile" accept="image/*">
                <input type="hidden" id="existingImageUrl">
                <small style="color: #666;">(Bỏ trống nếu không muốn đổi ảnh)</small>
            </div>
            <button type="button" onclick="saveLaptop()">💾 Lưu Sản Phẩm</button>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
