<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Shop</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div class="container">
        <h1>Available Laptops</h1>
        <div id="list"></div>
        <a href="/user/cart.html">View Cart</a>
    </div>
    <script>
        async function load() {
            const res = await fetch('/api/laptops');
            const data = await res.json();
            const list = document.getElementById('list');
            data.forEach(l => {
                const el = document.createElement('div');
                el.innerHTML = `<strong>${l.name}</strong> - ${l.brand} - $${l.price}`;
                list.appendChild(el);
            });
        }
        load();
    </script>
</body>

</html>
