<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Laptop Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .auth-card {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .auth-card h2 {
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: #007bff;
        }

        .pwd-container {
            position: relative;
        }

        .pwd-container input {
            padding-right: 40px;
        }

        .pwd-toggle {
            position: absolute;
            right: 10px;
            top: 12px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            color: #666;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0056b3;
        }

        .auth-links {
            margin-top: 20px;
            font-size: 14px;
        }

        .auth-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            margin-top: 25px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <h2>Đăng nhập hệ thống</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email / Tên đăng nhập</label>
                <input type="text" id="l_email" required placeholder="Nhập email hoặc tên đăng nhập...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="pwd-container">
                    <input type="password" id="l_pass" required placeholder="Nhập mật khẩu...">
                    <button type="button" class="pwd-toggle" onclick="togglePwd('l_pass')">👁</button>
                </div>
            </div>
            <button type="submit" class="btn-submit">Đăng nhập</button>
        </form>
        <div class="auth-links">Chưa có tài khoản? <a href="/register.html">Đăng ký ngay</a></div>
        <a href="/" class="back-home">&larr; Quay lại trang chủ</a>
    </div>

    <script>
        function togglePwd(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('l_email').value.trim();
            const password = document.getElementById('l_pass').value;
            try {
                const adminRes = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password: password })
                });

                if (adminRes.ok) {
                    const admin = await adminRes.json();
                    const user = {
                        name: admin.fullName || admin.username,
                        phone: '',
                        email: admin.username,
                        address: '',
                        isAdmin: true
                    };
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    window.location.href = '/admin/index.html';
                    return;
                }

                if (adminRes.status !== 401) {
                    throw new Error(`Lỗi xác thực admin (${adminRes.status})`);
                }

                const customerRes = await fetch('/customers/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                if (!customerRes.ok) {
                    if (customerRes.status === 401) {
                        alert('Email/tên đăng nhập hoặc mật khẩu không đúng');
                        return;
                    }
                    throw new Error(`Lỗi đăng nhập (${customerRes.status})`);
                }

                const customer = await customerRes.json();
                localStorage.setItem('currentUser', JSON.stringify({
                    name: customer.fullName,
                    phone: customer.phone,
                    email: customer.email,
                    address: customer.address,
                    isAdmin: false
                }));
                window.location.href = '/';
            } catch (e) {
                alert('Không thể đăng nhập: ' + e.message);
            }
        });
    </script>
</body>

</html>
