# Cấu hình kết nối MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
# Hãy đảm bảo bạn đã tạo database 'laptop_shop' trong MySQL
quarkus.datasource.jdbc.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/laptop_shop_db?sslMode=VERIFY_IDENTITY

# Production: không tự động tạo, xóa hoặc cập nhật cấu trúc database
%prod.quarkus.hibernate-orm.schema-management.strategy=none
%prod.quarkus.hibernate-orm.data-management.strategy=none

# Script dữ liệu tự động chạy khi khởi động
quarkus.hibernate-orm.sql-load-script=import.sql

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Giới hạn dung lượng request upload
quarkus.http.limits.max-body-size=10M

# JDBC connection pool
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.acquisition-timeout=15S
quarkus.datasource.jdbc.login-timeout=15S