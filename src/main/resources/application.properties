# Cấu hình kết nối MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}
# Hãy đảm bảo bạn đã tạo database 'laptop_shop' trong MySQL
quarkus.datasource.jdbc.url=jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/laptop_shop_db?sslMode=VERIFY_IDENTITY

# Cấu hình Hibernate tự động tạo bảng
quarkus.hibernate-orm.database.generation=update
# Script dữ liệu tự động chạy khi khởi động
quarkus.hibernate-orm.sql-load-script=import.sql
